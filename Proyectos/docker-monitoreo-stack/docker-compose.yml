version: "3.8"

# Stack de monitoreo industrial: Node-RED (ingesta/lógica) -> InfluxDB (histórico)
# -> Grafana (visualización). Proyecto de práctica del curso "Virtualización y
# Docker" de Ingelearn.

services:

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: bariloche-lab
      DOCKER_INFLUXDB_INIT_BUCKET: planta
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-cambiar-en-produccion
    volumes:
      - influxdb-data:/var/lib/influxdb2

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./node-red-data:/data
    depends_on:
      - influxdb

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin12345
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data:
