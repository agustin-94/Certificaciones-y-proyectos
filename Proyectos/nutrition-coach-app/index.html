const STORAGE_PREFIX = "coachnutricional:";

async function storageGet(key, fallback) {
  try {
    if (typeof window === "undefined" || !window.localStorage) return fallback;
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    console.error("storage get error", key, err);
    return fallback;
  }
}

async function storageSet(key, value) {
  try {
    if (typeof window === "undefined" || !window.localStorage) return;
    window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (err) {
    console.error("storage set error", key, err);
  }
}

function getApiKey() {
  try {
    return window.localStorage.getItem(STORAGE_PREFIX + "apiKey") || "";
  } catch (err) {
    return "";
  }
}

function setApiKey(key) {
  try {
    window.localStorage.setItem(STORAGE_PREFIX + "apiKey", key || "");
  } catch (err) {
    console.error("no se pudo guardar la api key", err);
  }
}

const GEMINI_MODEL = "gemini-flash-latest";

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function withTimeout(promise, ms, message) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(message)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

async function callClaudeOnce(messages, maxTokens) {
  const apiKey = getApiKey();
  if (!apiKey) {
    const err = new Error("Falta tu API key de Gemini. Ve a Ajustes y pégala primero.");
    err.code = "NO_API_KEY";
    throw err;
  }

  const contents = messages.map((m) => {
    const role = m.role === "assistant" ? "model" : "user";
    let parts;
    if (typeof m.content === "string") {
      parts = [{ text: m.content }];
    } else if (Array.isArray(m.content)) {
      parts = m.content.map((block) => {
        if (block.type === "text") {
          return { text: block.text };
        }
        if (block.type === "image") {
          return {
            inline_data: {
              mime_type: (block.source && block.source.media_type) || "image/jpeg",
              data: (block.source && block.source.data) || ""
            }
          };
        }
        return { text: "" };
      });
    } else {
      parts = [{ text: "" }];
    }
    return { role, parts };
  });

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 30000);
  let response;
  try {
    response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents,
          generationConfig: {
            maxOutputTokens: maxTokens,
            temperature: 0.4,
            responseMimeType: "application/json"
          }
        }),
        signal: controller.signal
      }
    );
  } catch (fetchErr) {
    if (fetchErr && fetchErr.name === "AbortError") {
      throw new Error("La IA tardó demasiado en responder (más de 30s). Probá de nuevo, puede ser tu conexión.");
    }
    throw new Error("No se pudo conectar con la IA. Revisá tu conexión a internet.");
  } finally {
    clearTimeout(timeoutId);
  }

  if (!response.ok) {
    let detail = "";
    try {
      const errJson = await response.json();
      detail = (errJson && errJson.error && errJson.error.message) || "";
    } catch (e) {
      // ignore
    }
    if (response.status === 400 && /API key/i.test(detail)) {
      throw new Error("Tu API key no es válida. Revísala en Ajustes.");
    }
    if (response.status === 404) {
      throw new Error("El modelo de IA cambió de nombre del lado de Google. Avisa a Agustín para actualizar la app.");
    }
    if (response.status === 429) {
      throw new Error("Llegaste al límite gratuito por ahora. Espera un minuto e intenta de nuevo.");
    }
    if (response.status === 503) {
      const err = new Error("El modelo gratuito está saturado en este momento. Probá de nuevo en unos segundos.");
      err.code = "OVERLOADED";
      throw err;
    }
    throw new Error(detail || `Error de red (${response.status})`);
  }

  const data = await response.json();
  if (data && data.error) {
    throw new Error(data.error.message || "Error al hablar con la IA");
  }

  const candidate = Array.isArray(data.candidates) ? data.candidates[0] : null;
  const parts =
    candidate && candidate.content && Array.isArray(candidate.content.parts)
      ? candidate.content.parts
      : [];
  const text = parts.map((p) => p.text || "").join("\n");

  if (candidate && candidate.finishReason === "MAX_TOKENS") {
    throw new Error(
      "La respuesta de la IA se cortó por ser demasiado larga. Probá de nuevo (si sigue pasando, pedí menos recetas por vez)."
    );
  }

  if (!text.trim()) {
    if (candidate && candidate.finishReason === "SAFETY") {
      throw new Error("Gemini bloqueó esta respuesta por sus filtros de contenido. Probá con otra foto o pedido.");
    }
    throw new Error("La IA no devolvió ninguna respuesta. Intenta de nuevo.");
  }

  return text;
}

async function callClaude(messages, maxTokens = 1000) {
  const maxAttempts = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      return await callClaudeOnce(messages, maxTokens);
    } catch (e) {
      lastErr = e;
      if (e && e.code === "OVERLOADED" && attempt < maxAttempts) {
        await sleep(attempt * 1500);
        continue;
      }
      throw e;
    }
  }
  throw lastErr;
}

function parseClaudeJson(text) {
  if (!text || !text.trim()) {
    throw new Error("La IA no devolvió ninguna respuesta");
  }
  let cleaned = text.trim();
  cleaned = cleaned.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "");
  cleaned = cleaned.trim();

  try {
    return JSON.parse(cleaned);
  } catch (e) {
    // buscamos el bloque { ... } u [ ... ] más externo, lo que aparezca primero
    const firstBrace = cleaned.indexOf("{");
    const firstBracket = cleaned.indexOf("[");
    let openChar = null;
    let openIdx = -1;
    if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) {
      openChar = "{";
      openIdx = firstBrace;
    } else if (firstBracket !== -1) {
      openChar = "[";
      openIdx = firstBracket;
    }
    const closeChar = openChar === "{" ? "}" : "]";
    const closeIdx = openChar ? cleaned.lastIndexOf(closeChar) : -1;

    if (openIdx !== -1 && closeIdx !== -1 && closeIdx > openIdx) {
      try {
        const parsed = JSON.parse(cleaned.slice(openIdx, closeIdx + 1));
        // si vino un array suelto, lo envolvemos para que el resto del código lo encuentre
        if (Array.isArray(parsed)) {
          return { items: parsed, recetas: parsed };
        }
        return parsed;
      } catch (e2) {
        // sigue abajo al error con diagnóstico
      }
    }

    const preview = cleaned.slice(0, 300);
    const err = new Error(
      "No se pudo interpretar la respuesta de la IA.\n\nLo que contestó:\n" + preview
    );
    throw err;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || "";
      const parts = String(result).split(",");
      resolve(parts.length > 1 ? parts[1] : parts[0]);
    };
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.readAsDataURL(file);
  });
}

function resizeImageToBase64(file, maxDim = 2000, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();

    const cleanup = () => URL.revokeObjectURL(objectUrl);

    img.onload = () => {
      try {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        cleanup();
        const base64 = dataUrl.split(",")[1] || "";
        if (!base64) {
          reject(new Error("No se pudo procesar la imagen"));
          return;
        }
        resolve({ base64, mimeType: "image/jpeg" });
      } catch (err) {
        cleanup();
        reject(err);
      }
    };

    img.onerror = () => {
      cleanup();
      reject(new Error("No se pudo leer la imagen seleccionada"));
    };

    img.src = objectUrl;
  });
}

function normalizeName(name) {
  return (name || "").toString().trim().toLowerCase();
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Buenos días";
  if (h < 20) return "Buenas tardes";
  return "Buenas noches";
}

function formatRelativeTime(iso) {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "ahora";
  if (mins < 60) return `hace ${mins} min`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `hace ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days === 1) return "ayer";
  if (days < 7) return `hace ${days} días`;
  return new Date(iso).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
}

const initialState = {
  profile: null,
  pantry: [],
  recipeHistory: [],
  ticketHistory: [],

function reducer(state, action) {
  switch (action.type) {
    case "HYDRATE": {
      const p = action.payload || {};
      return {
        ...state,
        profile: p.profile || null,
        pantry: Array.isArray(p.pantry) ? p.pantry : [],
        recipeHistory: Array.isArray(p.recipeHistory) ? p.recipeHistory : [],
        ticketHistory: Array.isArray(p.ticketHistory) ? p.ticketHistory : [],
        hydrated: true
      };
    }
    case "SET_PROFILE":
      return { ...state, profile: action.payload };
    case "ADD_PANTRY_ITEMS": {
      let pantry = [...state.pantry];
      (action.payload || []).forEach((newItem) => {
        if (!newItem || !newItem.name) return;
        const key = normalizeName(newItem.name);
        const idx = pantry.findIndex((p) => normalizeName(p.name) === key);
        const category = CATEGORIES.some((c) => c.value === newItem.category) ? newItem.category : "otro";
        if (idx >= 0) {
          const existing = pantry[idx];
          const sum = (Number(existing.quantity) || 0) + (Number(newItem.quantity) || 1);
          pantry[idx] = { ...existing, quantity: Math.round(sum * 100) / 100 };
        } else {
          pantry.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            name: newItem.name,
            quantity: Number(newItem.quantity) || 1,
            unit: newItem.unit || "ud",
            category
          });
        }
      });
      return { ...state, pantry };
    }
    case "UPDATE_PANTRY_QTY": {
      const pantry = state.pantry
        .map((p) => (p.id === action.payload.id ? { ...p, quantity: action.payload.quantity } : p))
        .filter((p) => p.quantity > 0);
      return { ...state, pantry };
    }
    case "REMOVE_PANTRY_ITEM":
      return { ...state, pantry: state.pantry.filter((p) => p.id !== action.payload) };
    case "ADD_TICKET_RECORD":
      return { ...state, ticketHistory: [action.payload, ...state.ticketHistory].slice(0, 50) };
    case "COOK_RECIPE": {
      const recipe = action.payload;
      let pantry = [...state.pantry];
      (recipe.ingredientes_usados || []).forEach((ing) => {
        const key = normalizeName(ing.name);
        const idx = pantry.findIndex((p) => normalizeName(p.name) === key);
        if (idx >= 0) {
          const remaining = (Number(pantry[idx].quantity) || 0) - (Number(ing.quantity) || 0);
          if (remaining > 0) {
            pantry[idx] = { ...pantry[idx], quantity: Math.round(remaining * 100) / 100 };
          } else {
            pantry.splice(idx, 1);
          }
        }
      });
      const record = {
        ...recipe,
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        cookedAt: new Date().toISOString()
      };
      return { ...state, pantry, recipeHistory: [record, ...state.recipeHistory].slice(0, 50) };
    }
    default:
      return state;
  }
}

function StepTransition({ children, stepKey }) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    setVisible(false);
    const id = requestAnimationFrame(() => setVisible(true));
    return () => cancelAnimationFrame(id);
  }, [stepKey]);
  return (
    <div
      className={`transition-all duration-300 ease-out ${
        visible ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2"
      }`}
    >
      {children}
    </div>
  );
}

function OnboardingFlow({ onComplete }) {
  const [step, setStep] = useState(0);
  const [draft, setDraft] = useState(EMPTY_DRAFT);

  const update = (field, value) => setDraft((d) => ({ ...d, [field]: value }));
  const toggleArr = (field, value) =>
    setDraft((d) => ({
      ...d,
      [field]: d[field].includes(value) ? d[field].filter((v) => v !== value) : [...d[field], value]
    }));

  const TOTAL = 6;
  const titles = ["", "Tu estilo de vida", "Cómo entrenas", "Tus objetivos", "Restricciones", "Todo listo"];
  const subtitles = [
    "",
    "Nos ayuda a calcular tus necesidades reales.",
    "Así ajustamos tus recetas a tu esfuerzo.",
    "Para sugerirte lo que de verdad encaja contigo.",
    "Nunca te sugeriremos algo que no puedas comer.",
    "Revisa que todo esté bien antes de empezar."
  ];

  function handleNext() {
    if (step < TOTAL - 1) setStep(step + 1);
    else onComplete(draft);
  }

  return (
    <div className="min-h-screen bg-stone-50 flex flex-col font-sans">
      <div className="max-w-4xl mx-auto w-full flex flex-col flex-1">
        {step > 0 && (
          <div className="px-6 pt-6">
            <ProgressBar step={step} total={TOTAL} />
          </div>
        )}
        <div className="flex-1 overflow-y-auto px-6">
          <StepTransition stepKey={step}>
            {step === 0 && <WelcomeStep onStart={() => setStep(1)} />}
            {step > 0 && step < TOTAL - 1 && (
              <div className="pb-4 pt-6">
                <h2 className="text-xl font-bold text-stone-800 tracking-tight mb-1">{titles[step]}</h2>
                <p className="text-stone-400 text-sm mb-6">{subtitles[step]}</p>
                {step === 1 && <LifestyleFields draft={draft} update={update} />}
                {step === 2 && <TrainingFields draft={draft} update={update} />}
                {step === 3 && <GoalsFields draft={draft} update={update} toggleArr={toggleArr} />}
                {step === 4 && <RestrictionsFields draft={draft} update={update} toggleArr={toggleArr} />}
              </div>
            )}
            {step === TOTAL - 1 && (
              <div className="pt-6">
                <SummaryStep draft={draft} />
              </div>
            )}
          </StepTransition>
        </div>
        {step > 0 && (
          <div className="flex items-center gap-3 px-6 pb-8 pt-3">
            <button
              type="button"
              onClick={() => setStep(step - 1)}
              className="w-12 h-12 flex items-center justify-center rounded-2xl border border-stone-200 text-stone-500 active:scale-95 transition-transform shrink-0"
            >
              <ArrowLeft size={18} />
            </button>
            <button
              type="button"
              onClick={handleNext}
              className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-2xl shadow-sm active:scale-95 transition-all duration-150 flex items-center justify-center gap-2"
            >
              {step === TOTAL - 1 ? "Confirmar y empezar" : "Continuar"}
              {step !== TOTAL - 1 && <ArrowRight size={18} />}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

          <ProfileRow label="Entrenamiento" value={(TRAINING_TYPES.find((t) => t.value === profile.trainingType) || {}).label || "—"} />
          <ProfileRow label="Frecuencia" value={`${profile.trainingFrequency || "—"}x/semana`} />
          <ProfileRow label="Duración" value={`${profile.trainingDuration || "—"} min`} />
          <ProfileRow label="Momento" value={(TRAINING_TIMES.find((t) => t.value === profile.trainingTime) || {}).label || "—"} />
        </div>

        <div className="bg-white rounded-3xl border border-stone-100 shadow-sm p-5 flex flex-col gap-3">
          <p className="text-xs font-semibold text-stone-400 uppercase tracking-wide">Objetivos</p>
          <div className="flex flex-wrap gap-1.5">
            {(profile.goals || []).map((g) => (
              <span key={g} className="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-medium">
                {(GOALS.find((x) => x.value === g) || {}).label || g}
              </span>
            ))}
            {(!profile.goals || profile.goals.length === 0) && <span className="text-sm text-stone-300">—</span>}
          </div>
          {profile.goalsText && <p className="text-sm text-stone-500 italic">"{profile.goalsText}"</p>}
        </div>

        <div className="bg-white rounded-3xl border border-stone-100 shadow-sm p-5 flex flex-col gap-3">
          <p className="text-xs font-semibold text-stone-400 uppercase tracking-wide">Restricciones</p>
          <RestrictionsList
            allergies={profile.allergies}
            intolerances={profile.intolerances}
            preferences={profile.preferences}
            otherRestrictions={profile.otherRestrictions}
          />
        </div>
      </div>
    );
  }

  return (
    <div className="px-5 pt-8 pb-6 flex flex-col gap-6">
      <h1 className="text-2xl font-bold text-stone-800 tracking-tight">Editar perfil</h1>
      <ProfileEditSections draft={draft} update={update} toggleArr={toggleArr} />
      <div className="flex items-center gap-3 pt-2">
        <button
          type="button"
          onClick={onCancel}
          className="flex-1 py-3.5 rounded-2xl border border-stone-200 text-stone-500 font-semibold active:scale-95 transition-transform"
        >
          Cancelar
        </button>
        <button
          type="button"
          onClick={() => onSave(draft)}
          className="flex-1 py-3.5 rounded-2xl bg-emerald-600 text-white font-semibold active:scale-95 transition-transform"
        >
          Guardar
        </button>
      </div>
    </div>
  );
}

   APP PRINCIPAL

function NutritionCoachApp() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [activeTab, setActiveTab] = useState("home");

  const [ticketProcessing, setTicketProcessing] = useState(false);
  const [ticketError, setTicketError] = useState(null);
  const [ticketToast, setTicketToast] = useState(null);
  const [lastFile, setLastFile] = useState(null);

  const [recipes, setRecipes] = useState([]);
  const [recipesLoading, setRecipesLoading] = useState(false);
  const [recipesError, setRecipesError] = useState(null);
  const [expandedRecipe, setExpandedRecipe] = useState(null);
  const [cookedIds, setCookedIds] = useState([]);

  const [profileEdit, setProfileEdit] = useState(false);

  // Hidratación: un solo get por clave al cargar
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const [profile, pantry, recipeHistory, ticketHistory] = await Promise.all([
        storageGet("profile:user", null),
        storageGet("pantry:items", []),
        storageGet("history:recipes", []),
        storageGet("history:tickets", [])
      ]);
      if (!cancelled) {
        dispatch({ type: "HYDRATE", payload: { profile, pantry, recipeHistory, ticketHistory } });
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  // Persistencia: sets batcheados por slice, solo tras hidratar
  useEffect(() => {
    if (!state.hydrated) return;
    storageSet("profile:user", state.profile);
  }, [state.profile, state.hydrated]);

  useEffect(() => {
    if (!state.hydrated) return;
    storageSet("pantry:items", state.pantry);
  }, [state.pantry, state.hydrated]);

  useEffect(() => {
    if (!state.hydrated) return;
    storageSet("history:recipes", state.recipeHistory);
  }, [state.recipeHistory, state.hydrated]);

  useEffect(() => {
    if (!state.hydrated) return;
    storageSet("history:tickets", state.ticketHistory);
  }, [state.ticketHistory, state.hydrated]);

  useEffect(() => {
    if (!ticketToast) return;
    const t = setTimeout(() => setTicketToast(null), 3500);
    return () => clearTimeout(t);
  }, [ticketToast]);

  async function processTicket(file) {
    setTicketProcessing(true);
    setTicketError(null);
    setLastFile(file);
    try {
      let base64, mimeType;
      try {
        const resized = await withTimeout(
          resizeImageToBase64(file),
          8000,
          "TIMEOUT_RESIZE"
        );
        base64 = resized.base64;
        mimeType = resized.mimeType;
      } catch (resizeErr) {
        // si falla o se cuelga el redimensionado, mandamos la foto original sin procesar
        base64 = await fileToBase64(file);
        mimeType = file.type || "image/jpeg";
      }
      const messages = [
        {
          role: "user",
          content: [
            { type: "text", text: TICKET_PROMPT },
            { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } }
          ]
        }
      ];
      const text = await callClaude(messages, 1000);
      const json = parseClaudeJson(text);
      const items = Array.isArray(json.items) ? json.items : [];
      dispatch({ type: "ADD_PANTRY_ITEMS", payload: items });
      dispatch({
        type: "ADD_TICKET_RECORD",
        payload: {
          id: `${Date.now()}`,
          date: new Date().toISOString(),
          itemCount: items.length,
          summary: items.slice(0, 3).map((i) => i.name).join(", ") || "Sin productos detectados"
        }
      });
      if (items.length > 0) {
        setTicketToast(
          `${items.length} ingrediente${items.length === 1 ? "" : "s"} añadido${items.length === 1 ? "" : "s"} a tu despensa`
        );
      } else {
        setTicketError(
          "No se detectó ningún producto en esa foto. Probá con más luz, más cerca del ticket y que se lea bien el texto."
        );
      }
    } catch (e) {
      setTicketError((e && e.message) || "No pudimos leer el ticket. Inténtalo de nuevo.");
    } finally {
      setTicketProcessing(false);
    }
  }

  async function generateRecipes() {
    setRecipesLoading(true);
    setRecipesError(null);
    setExpandedRecipe(null);
    try {
      const prompt = buildRecipePrompt(state.profile, state.pantry);
      const text = await callClaude([{ role: "user", content: prompt }], 8192);
      const json = parseClaudeJson(text);
      const recetas = Array.isArray(json.recetas) ? json.recetas : [];
      setRecipes(recetas);
      setCookedIds([]);
    } catch (e) {
      setRecipesError((e && e.message) || "No pudimos generar recetas. Inténtalo de nuevo.");
    } finally {
      setRecipesLoading(false);
    }
  }

  function handleCookRecipe(recipe, idx) {
    dispatch({ type: "COOK_RECIPE", payload: recipe });
    setCookedIds((ids) => [...ids, idx]);
  }

  if (!state.hydrated) {
    return <SplashLoading />;
  }

  const showOnboarding = !state.profile || !state.profile.onboarded;

  if (showOnboarding) {
    return (
      <OnboardingFlow
        onComplete={(profile) => dispatch({ type: "SET_PROFILE", payload: { ...profile, onboarded: true } })}
      />
    );
  }

  return (
    <div className="min-h-screen bg-stone-50 font-sans">
      <div className="max-w-4xl mx-auto md:my-6 md:rounded-3xl md:shadow-lg md:border md:border-stone-200 bg-stone-50 md:overflow-hidden flex flex-col min-h-screen md:min-h-0">
        <main className="flex-1 overflow-y-auto pb-2">
          {activeTab === "home" && (
            <HomeScreen
              profile={state.profile}
              pantryCount={state.pantry.length}
              cookedCount={state.recipeHistory.length}
              ticketHistory={state.ticketHistory}
              recipeHistory={state.recipeHistory}
              onUploadTicket={processTicket}
              ticketProcessing={ticketProcessing}
              ticketError={ticketError}
              onRetryTicket={() => lastFile && processTicket(lastFile)}
              onGoToRecipes={() => setActiveTab("recipes")}
            />
          )}

          {activeTab === "pantry" && (
            <PantryScreen
              pantry={state.pantry}
              onUploadTicket={processTicket}
              processing={ticketProcessing}
              error={ticketError}
              onRetry={() => lastFile && processTicket(lastFile)}
              onIncrement={(item) =>
                dispatch({
                  type: "UPDATE_PANTRY_QTY",
                  payload: { id: item.id, quantity: Math.round(((Number(item.quantity) || 0) + 1) * 100) / 100 }
                })
              }
              onDecrement={(item) =>
                dispatch({
                  type: "UPDATE_PANTRY_QTY",
                  payload: { id: item.id, quantity: Math.max(0, Math.round(((Number(item.quantity) || 0) - 1) * 100) / 100) }
                })
              }
              onRemove={(item) => dispatch({ type: "REMOVE_PANTRY_ITEM", payload: item.id })}
              onAddManual={(item) => dispatch({ type: "ADD_PANTRY_ITEMS", payload: [item] })}
            />
          )}

          {activeTab === "recipes" && (
            <RecipesScreen
              pantryEmpty={state.pantry.length === 0}
              recipes={recipes}
              loading={recipesLoading}
              error={recipesError}
              onGenerate={generateRecipes}
              expandedRecipe={expandedRecipe}
              onToggleExpand={(i) => setExpandedRecipe(expandedRecipe === i ? null : i)}
              onCook={handleCookRecipe}
              cookedIds={cookedIds}
              history={state.recipeHistory}
            />
          )}

          {activeTab === "settings" && <SettingsScreen />}

          {activeTab === "profile" && (
            <ProfileScreen
              profile={state.profile}
              editMode={profileEdit}
              onEdit={() => setProfileEdit(true)}
              onCancel={() => setProfileEdit(false)}
              onSave={(p) => {
                dispatch({ type: "SET_PROFILE", payload: { ...p, onboarded: true } });
                setProfileEdit(false);
              }}
            />
          )}
        </main>
        <TabBar active={activeTab} onChange={setActiveTab} />
      </div>
      {ticketToast && <Toast message={ticketToast} />}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<NutritionCoachApp />);
